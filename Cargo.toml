[package]
name = "boxy-synth"
version = "0.1.0"
authors = ["Eoghan West <eowest@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clack-extensions = { git = "https://github.com/prokopyl/clack.git", version = "0.1.0", features = ["clack-plugin", "gui", "log", "params"] }
clack-host = { git = "https://github.com/prokopyl/clack.git", version = "0.1.0" }
clap-sys = "0.5.0"
dioxus = { version = "0.7.1", features = [] }
jack = "0.13.3"
shellexpand = "3.1.1"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
